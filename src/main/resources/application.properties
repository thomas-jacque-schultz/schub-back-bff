spring.application.name=schub.bff
spring.config.import=optional:configtree:/run/secrets/

# Les deux amonts du BFF depuis la phase 4. Il ne connaît qu'eux : ni Mongo (il est sans
# etat), ni Portainer, ni la box.
#
# Le coeur sert tout le domaine -- GameServer, deploiements, politique de ports.
core.base-url=${CORE_URL:http://schub-core:8080}
# Le connecteur Discord ne sert plus que ce qui est reellement Discord.
connector.discord.base-url=${CONNECTOR_DISCORD_URL:http://connector-discord:8080}

# Secret partage par tous les services Schub. Aucun appel entre services sans lui (plan 5).
schub.internal-secret=${SCHUB_INTERNAL_SECRET:change-me-internal-secret}

server.port=8080

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Duree du jeton : 15 minutes (decision n 3 du 18-09), contre 1 h auparavant. Les permissions
# voyagent dedans, donc retirer un droit prend effet en 15 min au pire. Pour que ca ne se paie
# pas en deconnexions, le BFF reemet le jeton des qu'il lui reste moins de la moitie de sa vie
# -- une session glissante, sans refresh token et sans etat cote BFF.
#
# Attention : si l'environnement definit AUTH_JWT_EXPIRATION_SECONDS, sa valeur l'emporte sur
# cette ligne. La variable doit etre retiree des composes, ou passee a 900.
auth.jwt.expiration-seconds=${AUTH_JWT_EXPIRATION_SECONDS:900}

# L'identifiant Discord derriere le compte local par mot de passe. Le coeur ne connait que des
# comptes Discord : sans cette valeur, le compte local se connecte au BFF et se fait refuser
# par le coeur a chaque appel, faute de designer un acteur connu. Meme valeur que celle qui
# seme l'OWNER dans le coeur. Disparaitra avec le compte local, au lot A.6.
discord.admin.id=${DISCORD_ADMIN_ID:}

# --- Connexion Discord (lot A.3) ---
#
# Le client id est public par conception ; le secret ne l'est pas et ne doit apparaitre ni ici,
# ni dans un compose versionne, ni dans un journal. Il arrive par l'environnement ou par
# spring.config.import=optional:configtree:/run/secrets/ -- comme les autres secrets Schub.
#
# Les deux URL de rappel sont declarees dans le portail developpeur Discord et doivent
# correspondre au caractere pres :
#   dev  : http://localhost:18090/api/auth/discord/callback
#   prod : https://schultz-thomas.fr/api/auth/discord/callback
discord.oauth.client-id=${DISCORD_OAUTH_CLIENT_ID:}
discord.oauth.client-secret=${DISCORD_OAUTH_CLIENT_SECRET:}
discord.oauth.redirect-uri=${DISCORD_OAUTH_REDIRECT_URI:http://localhost:18090/api/auth/discord/callback}
discord.oauth.authorization-uri=${DISCORD_OAUTH_AUTHORIZATION_URI:https://discord.com/oauth2/authorize}
discord.oauth.token-uri=${DISCORD_OAUTH_TOKEN_URI:https://discord.com/api/oauth2/token}
discord.oauth.user-info-uri=${DISCORD_OAUTH_USER_INFO_URI:https://discord.com/api/users/@me}
# Ou le navigateur repart une fois le cookie pose. Chemin relatif : on ne redirige pas hors du site.
discord.oauth.post-login-redirect=${DISCORD_OAUTH_POST_LOGIN_REDIRECT:/}
# PKCE S256. Coupable si le fournisseur venait a refuser le parametre -- ce qui se verrait
# immediatement, l'echange du code echouant en bloc.
discord.oauth.pkce-enabled=${DISCORD_OAUTH_PKCE_ENABLED:true}

# Le cookie de session porte l'attribut Secure. A laisser a true en prod ; la soupape existe
# parce que le dev passe par http://localhost:18090, que les navigateurs traitent comme une
# origine sure mais qu'on prefere ne pas decouvrir un lundi matin.
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}

# --- Formulaire de contact du portfolio (chantier C) ---
#
# Le destinataire est le meme compte que le super-administrateur : DISCORD_ADMIN_ID. Sans lui,
# la route repond 503 et le dit dans les journaux plutot que d'annoncer au visiteur un envoi
# qui n'a eu lieu nulle part.
contact.recipient-id=${DISCORD_ADMIN_ID:}
# Au-dela, le message est refuse plutot que tronque. 4000 laisse de la marge sous la limite de
# 4096 caracteres d'un encart Discord, que le connecteur applique de son cote.
contact.max-message-length=${CONTACT_MAX_MESSAGE_LENGTH:4000}
# Cinq messages par heure et par adresse : large pour un humain, etroit pour un robot.
contact.per-ip-per-hour=${CONTACT_PER_IP_PER_HOUR:5}
# Le plafond global n'existe pas pour filtrer, mais pour qu'une attaque distribuee coute une
# journee de formulaire indisponible plutot qu'une messagerie noyee.
contact.global-per-hour=${CONTACT_GLOBAL_PER_HOUR:60}
# Turnstile : DESACTIVE tant que ce secret est absent, et c'est voulu -- la cle n'existe pas
# encore, et le developpement ne doit pas l'attendre. Les deux autres couches restent actives.
contact.turnstile.secret=${TURNSTILE_SECRET:}
contact.turnstile.verify-url=${TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
